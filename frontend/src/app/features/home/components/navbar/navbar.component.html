<header class="navbar">
  <div class="navbar__inner container">
    <a class="brand" routerLink="/" aria-label="SazónLocal, ir al inicio">
      <img src="assets/logo-horizontal.png" alt="SazónLocal" class="brand__logo" />
    </a>

    <div class="search" role="search">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.2-3.2" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        class="search__input"
        placeholder="Busca por nombre o platillo…"
        aria-label="Buscar negocios por nombre o platillo"
        [value]="search()"
        (input)="onSearchInput($event)"
      />
      @if (search()) {
        <button class="search__clear" type="button" (click)="clearSearch()" aria-label="Limpiar búsqueda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" />
          </svg>
        </button>
      }
    </div>

    <div class="actions">
      <button class="btn btn--primary btn--sm cta" type="button" (click)="requestBusiness()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" />
        </svg>
        <span class="cta__full">Registrar negocio</span>
        <span class="cta__short">Registrar</span>
      </button>

      @if (auth.isAuthenticated()) {
        <div class="user-menu" (click)="$event.stopPropagation()">
          <button
            class="user-chip"
            type="button"
            [attr.aria-expanded]="menuOpen()"
            aria-haspopup="menu"
            (click)="toggleMenu($event)"
          >
            <span class="avatar" aria-hidden="true">{{ auth.initials() }}</span>
            <span class="user-chip__name">{{ auth.firstName() }}</span>
            <svg class="chevron" [class.is-open]="menuOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="dropdown" role="menu">
              <div class="dropdown__header">
                <p class="dropdown__name">{{ auth.user()?.nombre_completo }}</p>
                <p class="dropdown__email">{{ auth.user()?.email }}</p>
              </div>
              <button class="dropdown__item" type="button" role="menuitem" (click)="requestBusiness()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M3 10h18M5 10V7l1-3h12l1 3v3M5 10v9h14v-9" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Registrar negocio
              </button>
              <button class="dropdown__item dropdown__item--danger" type="button" role="menuitem" (click)="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      } @else {
        <button class="btn btn--ghost btn--sm login-btn" type="button" (click)="authRequested.emit('login')">
          Iniciar sesión
        </button>
        <button class="btn btn--secondary btn--sm register-btn" type="button" (click)="authRequested.emit('register')">
          Crear cuenta
        </button>
      }
    </div>
  </div>
</header>
